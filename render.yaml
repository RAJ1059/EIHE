services:
  # NestJS backend (server/) — a separate, long-running API server.
  - type: web
    name: eihe-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: PORT
        value: 4000
      # Set to the frontend's real deployed URL (needed for CORS).
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: EIHE Admin
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "EIHE <no-reply@europeanihe.com>"

  # Next.js frontend (repo root) — the marketing site + student/admin portals.
  - type: web
    name: eihe-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Points the frontend's server-side API proxy at the backend above.
      - key: LMS_API_PROXY_TARGET
        value: https://eihe.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 4401434137-oja0qes4rfmq840ll4t75m3r30tab3al.apps.googleusercontent.com
      # Set to this service's own real deployed URL once Render assigns it.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
